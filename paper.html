<script>
"use strict";
// Unlock: PBKDF2-SHA256 turns the password into a key, AES-256-GCM opens the page with it
// (and refuses a wrong key). Remember me keeps the KEY, never the password, for a while.
(async () => {
  const P = JSON.parse(document.getElementById("payload").textContent);
  const SAVED = "arb-site-key";
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const text = raw => btoa(String.fromCharCode(...raw));
  async function derive(password) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits(
      { name: "PBKDF2", hash: "SHA-256", salt: bytes(P.salt), iterations: P.iter }, base, 256));
  }
  async function open(raw) {
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.data)));
  }
  async function show(html) {  // replace this page with the opened one, once this one has finished loading
    if (document.readyState === "loading") await new Promise(done => document.addEventListener("DOMContentLoaded", done));
    document.open(); document.write(html); document.close();
  }
  try {
    const saved = JSON.parse(localStorage.getItem(SAVED) || "null");
    if (saved && saved.salt === P.salt && saved.expires > Date.now()) { await show(await open(bytes(saved.key))); return; }
  } catch (e) { /* no saved key, an old one (new password) or storage blocked: ask */ }
  try { localStorage.removeItem(SAVED); } catch (e) { /* storage blocked */ }
  const form = document.getElementById("unlock"), msg = document.getElementById("msg"), go = document.getElementById("go");
  form.hidden = false;
  form.addEventListener("submit", async event => {
    event.preventDefault();
    go.disabled = true; msg.textContent = ""; go.textContent = "UNLOCKING…";
    const raw = await derive(document.getElementById("pw").value);
    let html;
    try { html = await open(raw); } catch (e) {
      go.disabled = false; go.textContent = "UNLOCK"; msg.textContent = "Wrong password.";
      return;
    }
    if (document.getElementById("remember").checked) {
      try { localStorage.setItem(SAVED, JSON.stringify({ key: text(raw), salt: P.salt, expires: Date.now() + 30 * 86400000 })); }
      catch (e) { /* not remembered: fine */ }
    }
    show(html);
  });
})();
</script>
</body>
</html>
